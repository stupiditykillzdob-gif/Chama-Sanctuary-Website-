<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The D.G. Chama Sanctuary Project | Chama, New Mexico</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest-dark: #0d1d16;
      --forest-card: #13281f;
      --forest-mid: #1a3529;
      --gold: #cfa968;
      --gold-hover: #dfc088;
      --gold-text: #111b16;
      --cream: #f5f2eb;
      --text-light: #ffffff;
      --text-muted: #d4dcd7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--forest-dark);
      color: var(--text-light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* NAVIGATION BAR */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(13, 29, 22, 0.95), rgba(13, 29, 22, 0.75));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(207, 169, 104, 0.25);
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-light);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-light);
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--gold);
    }

    .btn-gold-nav {
      background-color: var(--gold);
      color: var(--gold-text);
      padding: 10px 20px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      transition: background-color 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .btn-gold-nav:hover {
      background-color: var(--gold-hover);
      transform: translateY(-1px);
    }

    /* HERO SECTION */
    .hero {
      position: relative;
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 140px 24px 180px;
      /* REPLACE THE URL BELOW WITH YOUR OWN HERO PHOTO (e.g., 'hero-elk.jpg') */
      background-image: 
        linear-gradient(to right, rgba(11, 24, 18, 0.88) 0%, rgba(11, 24, 18, 0.55) 55%, rgba(11, 24, 18, 0.35) 100%),
        linear-gradient(to top, var(--forest-dark) 0%, transparent 25%),
        url('https://unsplash.com');
      background-size: cover;
      background-position: center;
    }

    .hero-inner {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    .hero-badge {
      display: inline-block;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      font-weight: 700;
      line-height: 1.12;
      max-width: 850px;
      text-transform: uppercase;
      margin-bottom: 22px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .hero p {
      font-size: clamp(1.05rem, 1.8vw, 1.25rem);
      color: var(--text-muted);
      max-width: 640px;
      margin-bottom: 36px;
      font-weight: 400;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .btn-primary {
      background-color: var(--gold);
      color: var(--gold-text);
      padding: 16px 32px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      border: 2px solid var(--gold);
      transition: all 0.25s ease;
    }

    .btn-primary:hover {
      background-color: var(--gold-hover);
      border-color: var(--gold-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: rgba(13, 29, 22, 0.65);
      color: var(--text-light);
      padding: 16px 32px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    /* THREE PILLAR CARDS (OVERLAPPING HERO) */
    .pillars-section {
      max-width: 1280px;
      margin: -110px auto 80px;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .pillar-card {
      position: relative;
      height: 360px;
      border: 3px solid var(--gold);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
      background-color: var(--forest-card);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: var(--text-light);
    }

    .pillar-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 26px 50px rgba(0, 0, 0, 0.75);
    }

    .pillar-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 22, 17, 0.96) 15%, rgba(10, 22, 17, 0.45) 60%, rgba(10, 22, 17, 0.2) 100%);
      z-index: 1;
    }

    .pillar-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .pillar-card:hover .pillar-bg {
      transform: scale(1.06);
    }

    .pillar-number {
      position: absolute;
      top: 0;
      left: 0;
      background-color: var(--gold);
      color: var(--gold-text);
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 18px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .pillar-content {
      position: relative;
      z-index: 2;
    }

    .pillar-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .pillar-desc {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-light);
      line-height: 1.4;
    }

    /* MISSION SECTION */
    .section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }

    .section h2 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      line-height: 1.2;
      margin-bottom: 24px;
      color: var(--text-light);
    }

    .section p {
      color: var(--text-muted);
      font-size: 17px;
      margin-bottom: 20px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 36px;
      padding-top: 30px;
      border-top: 1px solid rgba(207, 169, 104, 0.25);
    }

    .stat-item strong {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: var(--gold);
    }

    .stat-item span {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .mission-card-box {
      background-color: var(--forest-card);
      border: 1px solid rgba(207, 169, 104, 0.35);
      padding: 40px;
      border-radius: 6px;
    }

    .mission-card-box h3 {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .check-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .check-list li {
      padding-left: 28px;
      position: relative;
      color: var(--text-light);
      font-size: 15px;
    }

    .check-list li::before {
      content: "✦";
      position: absolute;
      left: 0;
      color: var(--gold);
      font-weight: bold;
    }

    /* SPONSORSHIP BANNER */
    .sponsor-banner {
